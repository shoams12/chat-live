<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1d2330; --muted: #7a8394;
    --mine: #3b6cf6; --mine-text: #fff; --theirs: #ffffff; --border: #dde2ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #8a93a5;
      --mine: #3b6cf6; --mine-text: #fff; --theirs: #262b35; --border: #2c323d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 720px; height: 100%;
    display: flex; flex-direction: column; background: var(--panel);
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; }
  header button { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; background: var(--bg);
  }
  .empty { margin: auto; color: var(--muted); }
  .msg { max-width: 75%; display: flex; flex-direction: column; align-self: flex-start; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .meta { font-size: 12px; color: var(--muted); margin: 0 6px 2px; }
  .bubble {
    padding: 8px 12px; border-radius: 16px; background: var(--theirs);
    border: 1px solid var(--border); white-space: pre-wrap; word-wrap: break-word;
  }
  .mine .bubble { background: var(--mine); color: var(--mine-text); border-color: var(--mine); }
  .actions { display: none; gap: 8px; font-size: 12px; margin: 2px 6px 0; }
  .mine:hover .actions, .mine.editing .actions { display: flex; }
  .actions button { background: none; border: none; padding: 0; color: var(--muted); cursor: pointer; font: inherit; }
  .actions button:hover { color: var(--text); }
  .edit-box { width: 100%; min-width: 220px; font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); resize: vertical; }
  form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .composer textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); max-height: 120px;
  }
  .btn { background: var(--mine); color: #fff; border: none; border-radius: 20px; padding: 0 18px; font: inherit; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay[hidden] { display: none; }
  .dialog { background: var(--panel); padding: 24px; border-radius: 14px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .dialog h2 { margin: 0; font-size: 18px; }
  .dialog input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .dialog .btn { padding: 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chat</h1>
    <button id="who" title="Change name"></button>
  </header>
  <div id="messages"><div class="empty">Loading…</div></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Type a message…" autocomplete="off"></textarea>
    <button class="btn" id="send" type="submit" disabled>Send</button>
  </form>
</div>

<div class="overlay" id="nameDialog" hidden>
  <form class="dialog" id="nameForm">
    <h2>What's your name?</h2>
    <input id="nameInput" maxlength="40" placeholder="Your name" required>
    <button class="btn" type="submit">Join chat</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const list = $("messages"), input = $("input"), sendBtn = $("send");
let me = "";
try { me = localStorage.getItem("chat-name") || ""; } catch {}
let lastSnapshot = "";
let editingId = null;

function setName(name) {
  me = name.trim();
  try { localStorage.setItem("chat-name", me); } catch {}
  $("who").textContent = me + " ✎";
  lastSnapshot = "";
  refresh();
}

function askName() {
  $("nameInput").value = me;
  $("nameDialog").hidden = false;
  $("nameInput").focus();
}

$("nameForm").onsubmit = (e) => {
  e.preventDefault();
  const v = $("nameInput").value.trim();
  if (!v) return;
  $("nameDialog").hidden = true;
  setName(v);
  input.focus();
};
$("who").onclick = askName;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

function formatTime(iso) {
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  return today
    ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function render(messages) {
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.innerHTML = "";
  if (!messages.length) {
    list.innerHTML = '<div class="empty">No messages yet. Say hi!</div>';
    return;
  }
  for (const m of messages) {
    const mine = m.author === me;
    const el = document.createElement("div");
    el.className = "msg" + (mine ? " mine" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    const edited = m.updated_at !== m.created_at ? " · edited" : "";
    meta.textContent = (mine ? "" : m.author + " · ") + formatTime(m.created_at) + edited;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.content;

    el.append(meta, bubble);

    if (mine) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.onclick = () => startEdit(el, bubble, m);
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.onclick = async () => {
        if (!confirm("Delete this message?")) return;
        await api("DELETE", `/messages/${m.id}`);
        refresh();
      };
      actions.append(edit, del);
      el.append(actions);
    }
    list.append(el);
  }
  if (nearBottom) list.scrollTop = list.scrollHeight;
}

function startEdit(el, bubble, m) {
  editingId = m.id;
  el.classList.add("editing");
  const box = document.createElement("textarea");
  box.className = "edit-box";
  box.value = m.content;
  bubble.replaceWith(box);
  box.focus();
  const actions = el.querySelector(".actions");
  actions.innerHTML = "";
  const save = document.createElement("button");
  save.textContent = "Save";
  const cancel = document.createElement("button");
  cancel.textContent = "Cancel";
  const finish = () => { editingId = null; lastSnapshot = ""; refresh(); };
  save.onclick = async () => {
    const text = box.value.trim();
    if (text && text !== m.content) await api("PATCH", `/messages/${m.id}`, { content: text });
    finish();
  };
  cancel.onclick = finish;
  box.onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save.onclick(); }
    if (e.key === "Escape") finish();
  };
  actions.append(save, cancel);
}

async function refresh() {
  if (editingId !== null) return; // don't wipe out an edit in progress
  try {
    const messages = await api("GET", "/messages");
    const snap = JSON.stringify(messages);
    if (snap !== lastSnapshot) {
      lastSnapshot = snap;
      render(messages);
    }
  } catch (err) {
    console.error(err);
  }
}

input.addEventListener("input", () => {
  sendBtn.disabled = !input.value.trim();
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});

$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !me) return;
  sendBtn.disabled = true;
  try {
    await api("POST", "/messages", { author: me, content: text });
    input.value = "";
    input.style.height = "auto";
    await refresh();
    list.scrollTop = list.scrollHeight;
  } finally {
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }
};

if (me) setName(me); else askName();
setInterval(refresh, 2000);
</script>
</body>
</html>
